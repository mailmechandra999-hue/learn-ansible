---
- name: Course information
  hosts: local
  connection: local

  vars:
    course: "AIOps with DevOps"
    duration_in_hrs: 150
    is_live: true

    topics:
      - Linux
      - Ansible
      - Terraform
      - Shell

    more_details:
      trainer: Chandra
      months: 4

    exact_duration_in_months: 4.5

  tasks:
    - name: Print course details and types
      ansible.builtin.debug:
        msg: |
          Name: {{ course }} ({{ course | type_debug }})
          Duration: {{ duration_in_hrs }} ({{ duration_in_hrs | type_debug }})
          Live: {{ is_live }} ({{ is_live | type_debug }})
          Topics: {{ topics }} ({{ topics | type_debug }})
          Trainer details: {{ more_details }} ({{ more_details | type_debug }})
          Exact duration: {{ exact_duration_in_months }} ({{ exact_duration_in_months | type_debug }})