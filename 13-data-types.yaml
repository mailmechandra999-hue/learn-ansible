- name: course information
  hosts: local
  connection: local
  vars:
    course: "AIopa with_DevOps" # sring
    duration_in_hrs: 150 # number
    is_live: yes # boolean
    topics: #list
    - Linux
    - Ansible
    - terraform
    - shell
    more_details: # dictionary/map
      trainer: Chandra
      months: 4
    exact_duration_in_months: 4.5 #
  tasks:
  - name: print course details and type
      debug: 
       msg: |
         name: "{{ course }}: {{course | type_debug }}"
         duration: "{{ duration_in_hrs }}: {{duration_in_hrs | type_debug }}
         live: "{{ is_live }}: {{ is_live | type_debug }}"
         topics are: "{{ topics }}: {{ topics | type_debug }}"
         trainer details: "{{ more_details }}: {{ more_details | type_debug }}"
         exact_time: "{{ exact_duration_in_months }}: {{ exact_duration_in_months | type_debug }}"

