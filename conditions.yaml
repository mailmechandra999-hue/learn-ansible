- name: even or odd
  hosts: local
  connection: local
  vars:
    given_number: 10
  tasks:
  - name: is even
    debug:
      mes:"Given number {{ given_number }} is even"
    when: given_number % 2 == 0 # expression

  - name: is odd
    debug:
      mes:"Given number {{ given_number }} is odd"
    when: given_number % 2 !== 0 # expression