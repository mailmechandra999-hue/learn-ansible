---
- name: Task-level variables
  hosts: local
  connection: local
  vars:
    property: "100 acres"

  tasks:
    - name: Print the play-level variable
      ansible.builtin.debug:
        msg: "Hi, I got {{ property }} from my father."

    - name: Print the task-level variable
      vars:
        property: "10 acres"
      ansible.builtin.debug:
        msg: "Hi, I got {{ property }} from my brother."