---
- name: Print facts
  hosts: local
  connection: local
  gather_facts: true

  tasks:
    - name: Print all facts
      ansible.builtin.debug:
        var: ansible_facts

    - name: Print selected information
      ansible.builtin.debug:
        msg: |
          OS Family: {{ ansible_facts['os_family'] }}
          Private IP: {{ ansible_facts['default_ipv4']['address'] }}